<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌面宠物</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        user-select: none;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
      }

      /* 整个宠物组合，锚定在窗口底部居中；宽度由内容决定 */
      /* 宠物组合在全屏透明层里自由定位，初始位置由 JS 设定 */
      #petWrap {
        position: fixed;
        left: 0;
        top: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* 对话气泡：浮在宠物上方 */
      #bubble {
        position: absolute;
        bottom: 100%;
        margin-bottom: 6px;
        max-width: 280px;
        min-width: 60px;
        padding: 11px 15px;
        background: rgba(255, 255, 255, 0.97);
        border-radius: 15px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.18);
        font-size: 14px;
        line-height: 1.5;
        color: #333;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 240px;
        overflow-y: auto;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.22s, transform 0.22s;
        pointer-events: none;
      }
      #bubble.show {
        opacity: 1;
        transform: translateY(0);
        pointer-events: auto;
      }

      /* 宠物本体（默认皮肤）——以后会被社区皮肤替换 */
      #pet {
        width: 130px;
        height: 130px;
        cursor: grab;
        animation: bob 2.6s ease-in-out infinite;
      }
      #pet svg {
        width: 100%;
        height: 100%;
        display: block;
        pointer-events: none; /* 点击落到 #pet 上，方便拖拽/点击 */
      }
      #petWrap.dragging #pet {
        cursor: grabbing;
        animation: none;
      }

      /* 换皮肤选择器 */
      #skinPicker {
        position: absolute;
        left: 100%;
        top: 20%;
        margin-left: 6px;
        background: rgba(255, 255, 255, 0.98);
        border-radius: 10px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.2);
        padding: 6px;
        display: none;
        flex-direction: column;
        gap: 2px;
        z-index: 10;
      }
      #skinPicker.open {
        display: flex;
      }
      .skinItem {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 7px 12px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 13px;
        color: #333;
        white-space: nowrap;
      }
      .skinItem:hover {
        background: #f0f0f5;
      }
      .skinItem.active {
        background: #e8eaff;
        font-weight: 600;
      }
      .skinItem .emo {
        font-size: 18px;
      }
      .skinItem .del {
        margin-left: auto;
        color: #c66;
        font-size: 12px;
        opacity: 0.6;
      }
      .skinItem .del:hover {
        opacity: 1;
      }
      .skinItem .addnew {
        color: #5b6cf6;
      }

      /* 创建/编辑皮肤表单 */
      #skinForm {
        position: fixed;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: 300px;
        max-height: 82vh;
        overflow-y: auto;
        background: rgba(255, 255, 255, 0.99);
        border-radius: 16px;
        box-shadow: 0 14px 44px rgba(0, 0, 0, 0.32);
        padding: 18px;
        display: none;
        flex-direction: column;
        gap: 11px;
        z-index: 50;
      }
      #skinForm.open {
        display: flex;
      }
      #skinForm h3 {
        font-size: 15px;
        color: #333;
        text-align: center;
      }
      #skinForm label {
        font-size: 12px;
        color: #777;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      #skinForm input[type="text"],
      #skinForm textarea {
        border: 1px solid #dcdce4;
        border-radius: 8px;
        padding: 7px 9px;
        font-size: 13px;
        outline: none;
        font-family: inherit;
        color: #333;
      }
      #skinForm input:focus,
      #skinForm textarea:focus {
        border-color: #7b8cf6;
      }
      #skinForm textarea {
        resize: vertical;
        min-height: 52px;
      }
      #avatarPreview {
        width: 64px;
        height: 64px;
        border-radius: 12px;
        object-fit: contain;
        background: #f3f3f7;
        align-self: center;
        display: none;
      }
      #bgStatus {
        font-size: 11px;
        color: #8a8aa0;
        text-align: center;
        min-height: 14px;
      }
      .formRow {
        display: flex;
        gap: 8px;
      }
      .formRow button {
        flex: 1;
        border: none;
        border-radius: 8px;
        padding: 9px;
        font-size: 13px;
        cursor: pointer;
      }
      #fSave {
        background: linear-gradient(135deg, #5b8def, #7b6cf6);
        color: #fff;
      }
      #fCancel {
        background: #eee;
        color: #555;
      }
      #fImport,
      #fExport {
        background: #eef0ff;
        color: #5b6cf6;
      }
      #pet:active {
        cursor: grabbing;
      }
      #pet.thinking {
        animation: bob 0.8s ease-in-out infinite;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(-1.5deg);
        }
        50% {
          transform: translateY(-7px) rotate(1.5deg);
        }
      }

      /* 关闭键：贴在宠物右上角，默认隐藏，悬停才显示 */
      #close {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 22px;
        height: 22px;
        border: none;
        border-radius: 50%;
        background: rgba(255, 110, 110, 0.95);
        color: #fff;
        font-size: 12px;
        cursor: pointer;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        opacity: 0;
        transform: scale(0.6);
        transition: opacity 0.18s, transform 0.18s;
        pointer-events: none;
        -webkit-app-region: no-drag;
      }

      /* 控制区：贴在宠物正下方，默认隐藏，悬停才显示 */
      #controls {
        position: absolute;
        top: 100%;
        display: flex;
        gap: 6px;
        align-items: center;
        padding-top: 4px; /* 与宠物无缝衔接，避免悬停断开 */
        opacity: 0;
        transform: translateY(-6px);
        transition: opacity 0.18s, transform 0.18s;
        pointer-events: none;
        -webkit-app-region: no-drag;
      }
      #msg {
        width: 180px;
        padding: 8px 12px;
        border: none;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.97);
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        font-size: 13px;
        outline: none;
      }
      #send {
        border: none;
        border-radius: 50%;
        width: 34px;
        height: 34px;
        cursor: pointer;
        font-size: 15px;
        color: #fff;
        background: linear-gradient(135deg, #5b8def, #7b6cf6);
        box-shadow: 0 3px 12px rgba(0, 0, 0, 0.15);
        transition: transform 0.1s;
      }
      #send:active {
        transform: scale(0.92);
      }

      /* 悬停（active）时显示关闭键与控制区 */
      #petWrap.active #close,
      #petWrap.active #controls {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: auto;
      }

      /* 右键菜单 */
      #menu {
        position: absolute;
        top: 30%;
        left: 100%;
        margin-left: 6px;
        background: rgba(255, 255, 255, 0.98);
        border-radius: 10px;
        box-shadow: 0 6px 22px rgba(0, 0, 0, 0.2);
        padding: 5px;
        font-size: 13px;
        display: none;
        white-space: nowrap;
        -webkit-app-region: no-drag;
        z-index: 10;
      }
      #menu.open {
        display: block;
      }
      #menu div {
        padding: 7px 14px;
        border-radius: 7px;
        cursor: pointer;
        color: #333;
      }
      #menu div:hover {
        background: #f0f0f5;
      }

      /* 思考动画的小圆点 */
      .dot {
        display: inline-block;
        animation: blink 1.2s infinite;
      }
      .dot:nth-child(2) {
        animation-delay: 0.2s;
      }
      .dot:nth-child(3) {
        animation-delay: 0.4s;
      }
      @keyframes blink {
        0%,
        100% {
          opacity: 0.2;
        }
        50% {
          opacity: 1;
        }
      }

      /* ---------- 对话记录面板 ---------- */
      #chatPanel {
        position: absolute;
        right: 100%; /* 放在宠物左侧 */
        bottom: 0;
        margin-right: 10px;
        width: 290px;
        height: 360px;
        background: rgba(255, 255, 255, 0.98);
        border-radius: 14px;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.22);
        display: none;
        flex-direction: column;
        overflow: hidden;
        -webkit-app-region: no-drag;
      }
      #chatPanel.open {
        display: flex;
      }
      #chatHeader {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        font-size: 13px;
        font-weight: 600;
        color: #444;
        border-bottom: 1px solid #eee;
      }
      #chatClose {
        border: none;
        background: transparent;
        cursor: pointer;
        font-size: 13px;
        color: #999;
      }
      #chatLog {
        flex: 1;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      #chatLog:empty::before {
        content: "还没有对话记录，跟我聊聊吧~";
        color: #bbb;
        font-size: 12px;
        margin: auto;
      }
      .msg {
        max-width: 80%;
        padding: 8px 11px;
        border-radius: 12px;
        font-size: 13px;
        line-height: 1.45;
        word-break: break-word;
        white-space: pre-wrap;
      }
      .msg.user {
        align-self: flex-end;
        background: linear-gradient(135deg, #5b8def, #7b6cf6);
        color: #fff;
        border-bottom-right-radius: 4px;
      }
      .msg.assistant {
        align-self: flex-start;
        background: #f0f0f5;
        color: #333;
        border-bottom-left-radius: 4px;
      }
      #chatFooter {
        display: flex;
        gap: 6px;
        padding: 8px;
        border-top: 1px solid #eee;
      }
      #chatInput {
        flex: 1;
        border: 1px solid #e2e2e8;
        border-radius: 14px;
        padding: 7px 11px;
        font-size: 13px;
        outline: none;
      }
      #chatSend {
        border: none;
        border-radius: 50%;
        width: 30px;
        height: 30px;
        color: #fff;
        background: linear-gradient(135deg, #5b8def, #7b6cf6);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="petWrap">
      <div id="bubble" class="interactive"></div>
      <button id="close" class="interactive" title="退出">✕</button>

      <!-- 宠物外观容器；皮肤的 SVG 由 JS 注入，可随时替换 -->
      <div id="pet" class="interactive"></div>

      <div id="controls" class="interactive">
        <input id="msg" type="text" placeholder="跟我聊点什么吧…" autocomplete="off" />
        <button id="send" title="发送">➤</button>
      </div>

      <div id="menu" class="interactive">
        <div data-action="skins">🎨 换皮肤</div>
        <div data-action="create">➕ 创建皮肤</div>
        <div data-action="history">💬 对话记录</div>
        <div data-action="reset">🧹 清空对话记忆</div>
        <div data-action="quit">🚪 退出</div>
      </div>

      <!-- 换皮肤选择器，选项由 JS 填充 -->
      <div id="skinPicker" class="interactive"></div>

      <div id="chatPanel" class="interactive">
        <div id="chatHeader">
          <span>💬 对话记录</span>
          <button id="chatClose" title="关闭">✕</button>
        </div>
        <div id="chatLog"></div>
        <div id="chatFooter">
          <input id="chatInput" type="text" placeholder="输入消息…" autocomplete="off" />
          <button id="chatSend" title="发送">➤</button>
        </div>
      </div>
    </div>

    <!-- 创建 / 编辑皮肤（人设卡）表单 -->
    <div id="skinForm" class="interactive">
      <h3>创建皮肤 · 人设卡</h3>
      <img id="avatarPreview" alt="头像预览" />
      <div id="bgStatus"></div>
      <label>
        头像图片（可选，自动去背景）
        <input id="fImage" type="file" accept="image/*" />
      </label>
      <label>
        名字
        <input id="fName" type="text" placeholder="如：傲娇猫娘" />
      </label>
      <label>
        人设（决定它的说话风格）
        <textarea id="fPersona" placeholder="如：你是一只傲娇的猫娘，嘴上嫌弃但内心关心主人…"></textarea>
      </label>
      <label>
        打招呼语
        <input id="fGreeting" type="text" placeholder="如：哼，你终于来了。" />
      </label>
      <label>
        单击反应（每行一句，随机抽一句）
        <textarea id="fClicks" placeholder="干嘛啦！&#10;别戳我！&#10;...哼"></textarea>
      </label>
      <div class="formRow">
        <button id="fImport">📥 导入卡</button>
        <button id="fExport">📤 导出卡</button>
      </div>
      <div class="formRow">
        <button id="fCancel">取消</button>
        <button id="fSave">保存并使用</button>
      </div>
      <input id="fImportFile" type="file" accept=".json,application/json" style="display: none" />
    </div>

    <script src="skins.js"></script>
    <script src="renderer.js"></script>
  </body>
</html>
